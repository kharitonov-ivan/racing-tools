<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVE TIMING</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --bg2: #111;
    --bg3: #1a1a1a;
    --line: #222;
    --red: #e8002d;
    --yellow: #ffd700;
    --green: #00e676;
    --blue: #2979ff;
    --dim: #555;
    --text: #f0f0f0;
    --mono: 'Share Tech Mono', monospace;
    --head: 'Barlow Condensed', sans-serif;
  }

- { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: var(–bg);
color: var(–text);
font-family: var(–head);
min-height: 100vh;
overflow-x: hidden;
}

/* ── CONFIG OVERLAY ── */
#config-overlay {
position: fixed; inset: 0;
background: rgba(0,0,0,.92);
display: flex; align-items: center; justify-content: center;
z-index: 999;
}
#config-overlay.hidden { display: none; }
.config-box {
background: var(–bg2);
border: 1px solid var(–red);
padding: 48px 56px;
text-align: center;
width: min(520px, 92vw);
}
.config-box h1 {
font-family: var(–head);
font-size: 2.4rem;
font-weight: 900;
letter-spacing: .12em;
text-transform: uppercase;
color: var(–red);
margin-bottom: 8px;
}
.config-box p { color: var(–dim); font-size: 1rem; margin-bottom: 32px; }
.cfg-row { display: flex; gap: 12px; margin-bottom: 16px; }
.cfg-row input {
flex: 1;
background: var(–bg3);
border: 1px solid var(–line);
color: var(–text);
font-family: var(–mono);
font-size: 1.1rem;
padding: 14px 18px;
outline: none;
transition: border-color .2s;
}
.cfg-row input:focus { border-color: var(–red); }
.cfg-row input::placeholder { color: var(–dim); }
.btn-connect {
width: 100%;
padding: 16px;
background: var(–red);
color: #fff;
font-family: var(–head);
font-size: 1.3rem;
font-weight: 700;
letter-spacing: .1em;
text-transform: uppercase;
border: none;
cursor: pointer;
transition: opacity .2s;
margin-top: 8px;
}
.btn-connect:hover { opacity: .85; }
.cfg-note {
margin-top: 20px;
font-size: .82rem;
color: var(–dim);
line-height: 1.6;
}

/* ── TOP BAR ── */
#topbar {
display: flex;
align-items: center;
justify-content: space-between;
padding: 0 28px;
height: 56px;
background: var(–bg2);
border-bottom: 2px solid var(–red);
}
.tb-title {
font-size: 1.6rem;
font-weight: 900;
letter-spacing: .14em;
text-transform: uppercase;
color: var(–text);
}
.tb-title span { color: var(–red); }
.tb-right { display: flex; align-items: center; gap: 24px; }
#session-name {
font-size: 1.1rem;
font-weight: 700;
letter-spacing: .08em;
color: var(–yellow);
text-transform: uppercase;
}
#clock {
font-family: var(–mono);
font-size: 1.2rem;
color: var(–text);
letter-spacing: .05em;
}
#status-dot {
width: 10px; height: 10px;
border-radius: 50%;
background: var(–dim);
transition: background .3s;
box-shadow: 0 0 0 3px rgba(255,255,255,.06);
}
#status-dot.live {
background: var(–green);
box-shadow: 0 0 0 3px rgba(0,230,118,.2), 0 0 12px rgba(0,230,118,.5);
animation: pulse 1.6s ease-in-out infinite;
}
#status-dot.error { background: var(–red); }
@keyframes pulse {
0%, 100% { opacity: 1; }
50% { opacity: .4; }
}
#settings-btn {
background: none;
border: 1px solid var(–line);
color: var(–dim);
font-family: var(–head);
font-size: .9rem;
padding: 6px 14px;
cursor: pointer;
letter-spacing: .06em;
text-transform: uppercase;
transition: color .2s, border-color .2s;
}
#settings-btn:hover { color: var(–text); border-color: var(–text); }

/* ── MAIN GRID ── */
#main {
display: grid;
grid-template-columns: 1fr 340px;
gap: 0;
height: calc(100vh - 56px);
}

/* ── TABLE ── */
#table-wrap {
overflow-y: auto;
padding: 0;
border-right: 1px solid var(–line);
}
#table-wrap::-webkit-scrollbar { width: 4px; }
#table-wrap::-webkit-scrollbar-thumb { background: var(–line); }

table {
width: 100%;
border-collapse: collapse;
table-layout: fixed;
}
thead tr {
background: var(–bg2);
position: sticky; top: 0; z-index: 10;
}
thead th {
font-family: var(–head);
font-size: .78rem;
font-weight: 700;
letter-spacing: .12em;
text-transform: uppercase;
color: var(–dim);
padding: 12px 16px;
text-align: left;
border-bottom: 1px solid var(–line);
}
thead th.num { text-align: center; }
thead th.right { text-align: right; }

tbody tr {
border-bottom: 1px solid var(–line);
transition: background .15s;
cursor: default;
}
tbody tr:hover { background: var(–bg3); }
tbody tr.p1 { background: rgba(232, 0, 45, .08); }
tbody tr.best-lap-row { background: rgba(0, 230, 118, .06); }

td {
padding: 14px 16px;
font-size: 1.35rem;
vertical-align: middle;
}

.col-pos { width: 52px; text-align: center; }
.col-num { width: 72px; text-align: center; }
.col-name { }
.col-laps { width: 64px; text-align: center; }
.col-last { width: 130px; text-align: right; }
.col-best { width: 130px; text-align: right; }
.col-gap  { width: 120px; text-align: right; }

.pos-num {
font-weight: 900;
font-size: 1.5rem;
line-height: 1;
}
.pos-1 { color: var(–yellow); }
.pos-2 { color: #c0c0c0; }
.pos-3 { color: #cd7f32; }

.car-num {
display: inline-block;
background: var(–bg3);
border: 1px solid var(–line);
font-family: var(–mono);
font-size: 1rem;
font-weight: 700;
padding: 3px 8px;
letter-spacing: .04em;
min-width: 40px;
text-align: center;
}

.driver-name {
font-weight: 700;
font-size: 1.3rem;
letter-spacing: .03em;
text-transform: uppercase;
}

.lap-time {
font-family: var(–mono);
font-size: 1.2rem;
letter-spacing: .03em;
}
.lap-time.best { color: var(–green); }
.lap-time.personal-best { color: var(–yellow); }

.gap {
font-family: var(–mono);
font-size: 1.1rem;
color: var(–dim);
}
.gap.leader { color: var(–red); font-weight: 700; }

.laps-num {
font-family: var(–mono);
font-size: 1.1rem;
color: var(–dim);
}

/* ── SIDE PANEL ── */
#side {
display: flex;
flex-direction: column;
overflow: hidden;
}

.side-section {
border-bottom: 1px solid var(–line);
padding: 20px 22px;
}
.side-label {
font-size: .72rem;
font-weight: 700;
letter-spacing: .15em;
text-transform: uppercase;
color: var(–dim);
margin-bottom: 14px;
}

/* Best lap card */
.best-card {
background: rgba(0,230,118,.06);
border: 1px solid rgba(0,230,118,.2);
padding: 16px 18px;
}
.best-card .bc-time {
font-family: var(–mono);
font-size: 2.4rem;
font-weight: 700;
color: var(–green);
letter-spacing: .04em;
line-height: 1;
}
.best-card .bc-driver {
font-size: 1.1rem;
font-weight: 700;
text-transform: uppercase;
color: var(–text);
margin-top: 6px;
}
.best-card .bc-lap {
font-size: .85rem;
color: var(–dim);
margin-top: 2px;
}

/* Delta */
#delta-wrap {
flex: 1;
overflow-y: auto;
padding: 20px 22px;
}
#delta-wrap::-webkit-scrollbar { width: 3px; }
#delta-wrap::-webkit-scrollbar-thumb { background: var(–line); }

.delta-row {
display: flex;
align-items: center;
gap: 10px;
padding: 8px 0;
border-bottom: 1px solid var(–line);
}
.delta-row:last-child { border-bottom: none; }
.dr-pos {
font-size: .85rem;
font-weight: 700;
color: var(–dim);
width: 20px;
}
.dr-name {
flex: 1;
font-size: 1rem;
font-weight: 600;
text-transform: uppercase;
letter-spacing: .03em;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.dr-delta {
font-family: var(–mono);
font-size: .95rem;
padding: 2px 8px;
border-radius: 2px;
min-width: 72px;
text-align: right;
}
.dr-delta.plus  { color: #ff6b6b; }
.dr-delta.minus { color: var(–green); }
.dr-delta.zero  { color: var(–dim); }

/* Bar chart for delta */
.delta-bar-wrap {
width: 60px;
height: 4px;
background: var(–line);
border-radius: 2px;
overflow: hidden;
}
.delta-bar {
height: 100%;
border-radius: 2px;
transition: width .4s;
}

/* ── EMPTY / ERROR STATES ── */
#empty-state {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
height: 60vh;
color: var(–dim);
gap: 12px;
}
#empty-state .es-icon { font-size: 3rem; }
#empty-state .es-text { font-size: 1.1rem; letter-spacing: .05em; text-transform: uppercase; }
#empty-state.hidden { display: none; }
</style>

</head>

<script>
// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
let feedUrl = '';
let pollInterval = null;
let buffer = '';

// competitors: regnum → { regnum, carnum, firstName, lastName }
const competitors = {};
// entries: regnum → { pos, laps, lastLap, bestLap, totalTime, gap }
const entries = {};
let sessionName = '';
let sessionBestLap = { time: Infinity, regnum: '', lap: 0 };

// ══════════════════════════════════════════════
//  CLOCK
// ══════════════════════════════════════════════
setInterval(() => {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toTimeString().slice(0, 8);
}, 1000);

// ══════════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════════
function showConfig() {
  document.getElementById('config-overlay').classList.remove('hidden');
}

function startFeed() {
  const ip   = document.getElementById('cfg-ip').value.trim();
  const port = document.getElementById('cfg-port').value.trim() || '50000';
  const path = document.getElementById('cfg-path').value.trim() || '/';

  if (!ip) { alert('Введи IP адрес'); return; }

  feedUrl = `http://${ip}:${port}${path.startsWith('/') ? path : '/' + path}`;
  document.getElementById('config-overlay').classList.add('hidden');

  if (pollInterval) clearInterval(pollInterval);
  fetchFeed();
  pollInterval = setInterval(fetchFeed, 2000);
}

// ══════════════════════════════════════════════
//  FETCH
// ══════════════════════════════════════════════
async function fetchFeed() {
  try {
    const resp = await fetch(feedUrl, {
      cache: 'no-store',
      signal: AbortSignal.timeout(4000)
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const text = await resp.text();
    setStatus('live');
    parseAll(text);
    render();
  } catch (e) {
    setStatus('error');
    console.warn('Feed error:', e.message);
  }
}

function setStatus(s) {
  const dot = document.getElementById('status-dot');
  dot.className = s === 'live' ? 'live' : s === 'error' ? 'error' : '';
}

// ══════════════════════════════════════════════
//  RMONITOR PARSER
// ══════════════════════════════════════════════
function parseAll(text) {
  // handle both full-reload and streaming (keep last partial line across ticks)
  const lines = text.split(/\r?\n/);
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    parseLine(line);
  }
}

function parseCSV(line) {
  // simple CSV parser that handles "quoted,fields"
  const result = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQ = !inQ; continue; }
    if (c === ',' && !inQ) { result.push(cur); cur = ''; continue; }
    cur += c;
  }
  result.push(cur);
  return result;
}

function parseLine(line) {
  if (!line.startsWith('$')) return;
  const cmd = line.slice(0, line.indexOf(',') === -1 ? line.length : line.indexOf(','));
  const rest = line.slice(cmd.length + 1);
  const f = parseCSV(rest);

  switch (cmd.toUpperCase()) {
    // $A,"regnum","carnum",transponder,"first","last","nat",classnum
    case '$A': {
      const regnum = f[0];
      competitors[regnum] = {
        regnum,
        carnum:    f[1] || regnum,
        firstName: f[3] || '',
        lastName:  f[4] || '',
      };
      break;
    }
    // $COMP,"regnum","carnum",transponder,"first","last","nat",classnum (extended)
    case '$COMP': {
      const regnum = f[0];
      competitors[regnum] = {
        regnum,
        carnum:    f[1] || regnum,
        firstName: f[3] || '',
        lastName:  f[4] || '',
      };
      break;
    }
    // $B,"session name" or $B,"name","date"
    case '$B': {
      sessionName = f[0] || '';
      document.getElementById('session-name').textContent = sessionName || '—';
      break;
    }
    // $G,pos,"regnum",laps,"laptime","totaltime",timestamp — race position
    case '$G': {
      const pos   = parseInt(f[0]) || 0;
      const regnum = f[1];
      const laps  = parseInt(f[2]) || 0;
      const lastLap   = parseTime(f[3]);
      const totalTime = parseTime(f[4]);

      if (!entries[regnum]) entries[regnum] = {};
      entries[regnum] = { ...entries[regnum], pos, laps, lastLap, totalTime, regnum };

      // update personal best
      if (lastLap > 0) {
        const prev = entries[regnum].bestLap || Infinity;
        if (lastLap < prev) {
          entries[regnum].bestLap = lastLap;
          // session best
          if (lastLap < sessionBestLap.time) {
            sessionBestLap = { time: lastLap, regnum, lap: laps };
          }
        }
      }
      break;
    }
    // $H,pos,"regnum",laps,"bestlap",timestamp — practice/qual
    case '$H': {
      const pos    = parseInt(f[0]) || 0;
      const regnum = f[1];
      const laps   = parseInt(f[2]) || 0;
      const bestLap = parseTime(f[3]);

      if (!entries[regnum]) entries[regnum] = {};
      entries[regnum] = { ...entries[regnum], pos, laps, bestLap, regnum };

      if (bestLap > 0 && bestLap < sessionBestLap.time) {
        sessionBestLap = { time: bestLap, regnum, lap: laps };
      }
      break;
    }
    // $J,"regnum",laps,"laptime","totaltime",timestamp — passing (lap crossing)
    case '$J': {
      const regnum  = f[0];
      const laps    = parseInt(f[1]) || 0;
      const lastLap = parseTime(f[2]);
      const total   = parseTime(f[3]);

      if (!entries[regnum]) entries[regnum] = {};
      entries[regnum].laps    = laps;
      entries[regnum].lastLap = lastLap;
      entries[regnum].totalTime = total;
      entries[regnum].regnum = regnum;

      if (lastLap > 0) {
        const prev = entries[regnum].bestLap || Infinity;
        if (lastLap < prev) {
          entries[regnum].bestLap = lastLap;
          if (lastLap < sessionBestLap.time) {
            sessionBestLap = { time: lastLap, regnum, lap: laps };
          }
        }
      }
      break;
    }
    // $I — init/reset
    case '$I': {
      // soft reset — don't clear competitors
      for (const k in entries) delete entries[k];
      sessionBestLap = { time: Infinity, regnum: '', lap: 0 };
      break;
    }
  }
}

// parse "MM:SS.mmm" or "SS.mmm" → seconds (float)
function parseTime(s) {
  if (!s) return 0;
  s = s.trim();
  const parts = s.split(':');
  if (parts.length === 2) {
    return parseInt(parts[0]) * 60 + parseFloat(parts[1]);
  }
  return parseFloat(s) || 0;
}

// seconds → "M:SS.mmm"
function fmtTime(sec) {
  if (!sec || sec <= 0) return '—';
  const m = Math.floor(sec / 60);
  const s = (sec % 60).toFixed(3).padStart(6, '0');
  return m > 0 ? `${m}:${s}` : s;
}

// seconds → "+S.mmm" delta
function fmtDelta(sec) {
  if (sec <= 0) return 'LEADER';
  const sign = '+';
  if (sec >= 60) {
    const m = Math.floor(sec / 60);
    const s = (sec % 60).toFixed(3).padStart(6, '0');
    return `${sign}${m}:${s}`;
  }
  return `${sign}${sec.toFixed(3)}`;
}

// ══════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════
function render() {
  const rows = Object.values(entries);
  if (rows.length === 0) return;

  // Sort: by pos if available, else by totalTime
  rows.sort((a, b) => {
    if (a.pos && b.pos) return a.pos - b.pos;
    if (a.laps !== b.laps) return (b.laps || 0) - (a.laps || 0);
    return (a.totalTime || Infinity) - (b.totalTime || Infinity);
  });

  const leaderTotal = rows[0]?.totalTime || 0;

  // show table
  document.getElementById('empty-state').classList.add('hidden');
  const table = document.getElementById('timing-table');
  table.style.display = '';

  const tbody = document.getElementById('timing-body');
  tbody.innerHTML = '';

  rows.forEach((entry, idx) => {
    const comp = competitors[entry.regnum] || { carnum: entry.regnum, firstName: '', lastName: entry.regnum };
    const pos = entry.pos || (idx + 1);
    const name = [comp.firstName, comp.lastName].filter(Boolean).join(' ') || comp.carnum;
    const gap = leaderTotal > 0 && entry.totalTime > 0 ? entry.totalTime - leaderTotal : 0;
    const isSessionBest = entry.bestLap === sessionBestLap.time && sessionBestLap.time < Infinity;

    let posClass = '';
    if (pos === 1) posClass = 'p1';
    else if (isSessionBest) posClass = 'best-lap-row';

    let bestClass = 'lap-time';
    if (isSessionBest) bestClass += ' best';
    else if (entry.bestLap && entry.lastLap && entry.bestLap === entry.lastLap) bestClass += ' personal-best';

    const posNumClass = pos === 1 ? 'pos-num pos-1' : pos === 2 ? 'pos-num pos-2' : pos === 3 ? 'pos-num pos-3' : 'pos-num';

    const tr = document.createElement('tr');
    tr.className = posClass;
    tr.innerHTML = `
      <td class="col-pos"><span class="${posNumClass}">${pos}</span></td>
      <td class="col-num"><span class="car-num">${comp.carnum}</span></td>
      <td class="col-name"><span class="driver-name">${name}</span></td>
      <td class="col-laps"><span class="laps-num">${entry.laps || '—'}</span></td>
      <td class="col-last"><span class="lap-time">${fmtTime(entry.lastLap)}</span></td>
      <td class="col-best"><span class="${bestClass}">${fmtTime(entry.bestLap)}</span></td>
      <td class="col-gap"><span class="gap ${idx === 0 ? 'leader' : ''}">${idx === 0 ? 'LEADER' : fmtDelta(gap)}</span></td>
    `;
    tbody.appendChild(tr);
  });

  // Best lap card
  if (sessionBestLap.time < Infinity) {
    const bc = competitors[sessionBestLap.regnum];
    const bcName = bc ? [bc.firstName, bc.lastName].filter(Boolean).join(' ') || bc.carnum : sessionBestLap.regnum;
    document.getElementById('bc-time').textContent = fmtTime(sessionBestLap.time);
    document.getElementById('bc-driver').textContent = bcName;
    document.getElementById('bc-lap').textContent = `Круг ${sessionBestLap.lap}`;
  }

  // Delta panel
  const deltaWrap = document.getElementById('delta-wrap');
  deltaWrap.innerHTML = '';
  const leaderBest = rows[0]?.bestLap || 0;
  const maxDelta = rows.reduce((m, r) => Math.max(m, (r.bestLap && leaderBest) ? r.bestLap - leaderBest : 0), 0.001);

  rows.forEach((entry, idx) => {
    const comp = competitors[entry.regnum] || {};
    const name = [comp.firstName, comp.lastName].filter(Boolean).join(' ') || comp.carnum || entry.regnum;
    const shortName = name.split(' ').pop() || name;
    const pos = entry.pos || (idx + 1);
    let deltaVal = 0, deltaStr = 'LEADER', deltaClass = 'dr-delta zero';

    if (idx > 0 && leaderBest > 0 && entry.bestLap > 0) {
      deltaVal = entry.bestLap - leaderBest;
      deltaStr = '+' + deltaVal.toFixed(3);
      deltaClass = 'dr-delta plus';
    } else if (idx === 0) {
      deltaStr = 'LEADER';
    }

    const barPct = maxDelta > 0 ? Math.min(100, (deltaVal / maxDelta) * 100) : 0;
    const barColor = idx === 0 ? 'var(--red)' : `hsl(${Math.max(0, 120 - barPct * 1.2)}, 70%, 55%)`;

    const div = document.createElement('div');
    div.className = 'delta-row';
    div.innerHTML = `
      <span class="dr-pos">${pos}</span>
      <span class="dr-name">${shortName}</span>
      <div class="delta-bar-wrap"><div class="delta-bar" style="width:${barPct}%;background:${barColor}"></div></div>
      <span class="${deltaClass}">${deltaStr}</span>
    `;
    deltaWrap.appendChild(div);
  });
}
</script>

</body>
</html>
