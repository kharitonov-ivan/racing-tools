[project]
name = "racing_tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "black>=25.11.0",
    "bmi-topography>=0.9.0",
    "contextily>=1.6.2",
    "dymos>=1.15.0",
    "geopandas>=1.1.1",
    "ipykernel>=7.1.0",
    "ipython>=9.7.0",
    "matplotlib>=3.10.7",
    "nbconvert>=7.16.6",
    "numpy>=2.3.4",
    "openmdao[notebooks]>=3.41.0",
    "pandas>=2.3.3",
    "pip>=25.3",
    "pygmsh>=7.1.17",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "rioxarray>=0.15.0",
    "xarray>=2024.1.0",
    "plotly>=5.24.1",
    "trimesh>=4.0.0",
    "converter>=1.0.0",
    "pyshp>=3.0.3",
    "tqdm>=4.67.1",
    "pdbpp>=0.11.7",
    "piexif>=1.1.3",
    "pytest>=9.0.2",
    "gpxpy>=1.6.2",
    "cython>=3.2.3",
    "cx-freeze>=8.5.1",
    "ffmpeg-python>=0.2.0",
    "pytesseract>=0.3.13",
    "ruff>=0.14.10",
    "opencv-python>=4.11.0.86",
    "cantools>=41.2.1",
]
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["racing_tools"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["I"]  # Enable isort rules for import sorting

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

